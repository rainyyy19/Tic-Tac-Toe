<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #f5f2ec;
    --card: #fffdf9;
    --ink: #3b3a38;
    --muted: #8a867f;
    --line: #e4dfd5;
    --x: #b5654a;       /* muted terracotta */
    --x-soft: #f3e1da;
    --o: #4f6f8f;       /* dusty slate blue */
    --o-soft: #dde6ee;
    --win: #e9e2c8;     /* soft sand */
    --shadow: 0 6px 24px rgba(80, 70, 50, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 24px;
  }
  h1 {
    margin: 0 0 18px;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .player {
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    text-align: center;
    transition: border-color .2s, background .2s;
  }
  .player.x.active { border-color: var(--x); background: var(--x-soft); }
  .player.o.active { border-color: var(--o); background: var(--o-soft); }
  .mark { font-size: 1.4rem; font-weight: 700; line-height: 1; }
  .player.x .mark { color: var(--x); }
  .player.o .mark { color: var(--o); }
  .player input {
    width: 100%;
    margin-top: 6px;
    border: none;
    background: transparent;
    text-align: center;
    font: inherit;
    font-size: .95rem;
    color: var(--ink);
    border-bottom: 1px dashed var(--line);
    padding: 2px 0;
    outline: none;
  }
  .player input:focus { border-bottom-color: var(--muted); }
  .score { margin-top: 6px; font-size: 1.3rem; font-weight: 600; }
  .score small { display: block; font-size: .7rem; font-weight: 400; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  .status {
    text-align: center;
    min-height: 1.6em;
    margin-bottom: 14px;
    font-size: 1.05rem;
    color: var(--muted);
  }
  .status b { color: var(--ink); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .cell {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #faf7f1;
    font-size: clamp(2.4rem, 12vw, 3.6rem);
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
    color: var(--ink);
    font-family: inherit;
  }
  .cell:hover:not(:disabled) { background: #f0ebe0; }
  .cell:active:not(:disabled) { transform: scale(.97); }
  .cell:focus-visible { outline: 3px solid #c9c2b0; outline-offset: 2px; }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: var(--win); border-color: #d6cca5; }
  .board { position: relative; }
  .strike {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .strike line {
    stroke-width: 9;
    stroke-linecap: round;
    opacity: .85;
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw .45s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cell.pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 11px 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: .95rem;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #f3efe6; }
  .btn.primary { background: #5d6b5a; border-color: #5d6b5a; color: #fff; }  /* muted sage */
  .btn.primary:hover { background: #4f5c4d; }

  .player input[readonly] { cursor: default; }
  .btn.ghost { flex: 0 0 auto; padding: 11px 14px; }

  /* overlays */
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(90, 82, 66, 0.28);
    backdrop-filter: blur(3px);
    padding: 20px; z-index: 10;
  }
  .overlay.show { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 14px 40px rgba(80, 70, 50, 0.18);
    padding: 26px 24px;
    text-align: center;
  }
  .modal h2 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 600; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: .95rem; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .field label .tag { font-weight: 700; font-size: 1rem; letter-spacing: 0; }
  .field.x .tag { color: var(--x); } .field.o .tag { color: var(--o); }
  .field input {
    width: 100%; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: #faf7f1; color: var(--ink);
    font: inherit; font-size: 1rem; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field.x input:focus { border-color: var(--x); box-shadow: 0 0 0 3px var(--x-soft); }
  .field.o input:focus { border-color: var(--o); box-shadow: 0 0 0 3px var(--o-soft); }
  .modal .btn { width: 100%; flex: none; margin-top: 6px; }

  #victory .modal { padding-top: 18px; }
  .cat { display: block; width: 190px; max-width: 60%; height: auto; margin: 0 auto 4px; }
  .modal.x h2 span { color: var(--x); } .modal.o h2 span { color: var(--o); }
  .modal .sub { margin-bottom: 18px; }
  .modal .row { display: flex; gap: 10px; }
  .modal .row .btn { margin-top: 0; width: auto; flex: 1; }
.err { min-height: 1.2em; margin-top: 10px; font-size: .85rem; color: var(--x); }
</style>
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe</h1>

    <section class="players">
      <div class="player x active" id="pX">
        <div class="mark">X</div>
        <input id="nameX" value="Player 1" maxlength="14" aria-label="Player X name" readonly tabindex="-1">
        <div class="score"><span id="scoreX">0</span><small>wins</small></div>
      </div>
      <div class="player o" id="pO">
        <div class="mark">O</div>
        <input id="nameO" value="Player 2" maxlength="14" aria-label="Player O name" readonly tabindex="-1">
        <div class="score"><span id="scoreO">0</span><small>wins</small></div>
      </div>
    </section>

    <div class="status" id="status" aria-live="polite"></div>
    <div class="board" id="board"></div>

    <div class="actions">
      <button class="btn primary" id="again">New Round</button>
      <button class="btn" id="reset">Reset Scores</button>
      <button class="btn ghost" id="change" title="Change player names">Players</button>
    </div>
  </main>

  <div class="overlay show" id="setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="modal" id="setupForm">
      <h2 id="setupTitle">Who's playing?</h2>
      <p>Enter both player names to begin.</p>
      <div class="field x">
        <label for="inX"><span class="tag">X</span> Player 1</label>
        <input id="inX" maxlength="14" placeholder="Enter name" autocomplete="off">
      </div>
      <div class="field o">
        <label for="inO"><span class="tag">O</span> Player 2</label>
        <input id="inO" maxlength="14" placeholder="Enter name" autocomplete="off">
      </div>
      <button class="btn primary" type="button" id="startBtn">Start Game</button>
      <div class="err" id="setupErr" aria-live="polite"></div>
    </div>
  </div>

      <div class="row">
        <button class="btn primary" id="next">Next Round</button>

  </div>


<script>
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const names = { X: document.getElementById('nameX'), O: document.getElementById('nameO') };
  const scoreEls = { X: document.getElementById('scoreX'), O: document.getElementById('scoreO') };
  const panels = { X: document.getElementById('pX'), O: document.getElementById('pO') };

  let board, turn, over, started = false, starter = 'X';
  const scores = { X: 0, O: 0 };
  const cells = [];

  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell';
    b.setAttribute('aria-label', 'Cell ' + (i + 1));
    b.addEventListener('click', () => play(i));
    boardEl.appendChild(b);
    cells.push(b);
  }

  const NS = 'http://www.w3.org/2000/svg';
  const strike = document.createElementNS(NS, 'svg');
  strike.setAttribute('class', 'strike');
  boardEl.appendChild(strike);
  let winLine = null, winner = null;

  function drawLine() {
    strike.innerHTML = '';
    if (!winLine) return;
    const center = i => {
      const c = cells[i];
      return { x: c.offsetLeft + c.offsetWidth / 2, y: c.offsetTop + c.offsetHeight / 2 };
    };
    const a = center(winLine[0]), b = center(winLine[2]);
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const pad = cells[0].offsetWidth * 0.32;   // extend past the end marks
    const ux = dx / d, uy = dy / d;
    const x1 = a.x - ux * pad, y1 = a.y - uy * pad;
    const x2 = b.x + ux * pad, y2 = b.y + uy * pad;
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
    ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
    ln.setAttribute('stroke', winner === 'X' ? '#b5654a' : '#4f6f8f');
    ln.style.setProperty('--len', Math.hypot(x2 - x1, y2 - y1));
    strike.appendChild(ln);
  }
  window.addEventListener('resize', drawLine);

  const nm = p => (names[p].value.trim() || (p === 'X' ? 'Player 1' : 'Player 2'));
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function setStatus() {
    if (!over) statusEl.innerHTML = `<b>${esc(nm(turn))}</b>'s turn (${turn})`;
    panels.X.classList.toggle('active', !over && turn === 'X');
    panels.O.classList.toggle('active', !over && turn === 'O');
  }

  function newRound() {
    hideVictory();
    board = Array(9).fill('');
    over = false;
    winLine = null; winner = null; drawLine();
    turn = starter;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; c.disabled = false; });
    setStatus();
  }

  function play(i) {
    if (over || board[i]) return;
    board[i] = turn;
    const c = cells[i];
    c.textContent = turn;
    c.classList.add(turn.toLowerCase(), 'pop');
    c.disabled = true;

    const line = LINES.find(l => l.every(k => board[k] === turn));
    if (line) {
      over = true;
      line.forEach(k => cells[k].classList.add('win'));
      winLine = line; winner = turn; drawLine();
      cells.forEach(x => x.disabled = true);
      scores[turn]++;
      scoreEls[turn].textContent = scores[turn];
      statusEl.innerHTML = `🎉 <b>${esc(nm(turn))}</b> wins this round!`;
      showVictory(turn);
      starter = starter === 'X' ? 'O' : 'X';
      panels.X.classList.remove('active'); panels.O.classList.remove('active');
      return;
    }
    if (board.every(Boolean)) {
      over = true;
      statusEl.innerHTML = `It's a <b>draw</b>.`;
      starter = starter === 'X' ? 'O' : 'X';
      panels.X.classList.remove('active'); panels.O.classList.remove('active');
      return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    setStatus();
  }

  document.getElementById('again').addEventListener('click', newRound);
  document.getElementById('reset').addEventListener('click', () => {
    scores.X = scores.O = 0;
    scoreEls.X.textContent = scoreEls.O.textContent = 0;
    starter = 'X';
    newRound();
  });


  // ---------- setup (player names) ----------
  const setupEl = document.getElementById('setup');
  const inX = document.getElementById('inX'), inO = document.getElementById('inO');
  function openSetup() {
    inX.value = names.X.value === 'Player 1' && !started ? '' : names.X.value;
    inO.value = names.O.value === 'Player 2' && !started ? '' : names.O.value;
    setupEl.classList.add('show');
    inX.focus();
  }
  function startGame() {
    const x = inX.value.trim(), o = inO.value.trim();
    const err = document.getElementById('setupErr');
    if (!x || !o) { err.textContent = 'Please enter both player names.'; (x ? inO : inX).focus(); return; }
    err.textContent = '';
    names.X.value = x; names.O.value = o;
    setupEl.classList.remove('show');
    if (!started) { started = true; newRound(); }
    else { scores.X = scores.O = 0; scoreEls.X.textContent = scoreEls.O.textContent = 0; starter = 'X'; newRound(); }
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  [inX, inO].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); }));
  document.getElementById('change').addEventListener('click', openSetup);

  // ---------- victory popup ----------
  const victoryEl = document.getElementById('victory');
  const winModal = document.getElementById('winModal');
  const catEl = document.getElementById('cat');
  const catSrc = catEl.src;
  let victoryTimer = null;
  function showVictory(p) {
    clearTimeout(victoryTimer);
    victoryTimer = setTimeout(() => {
      document.getElementById('winTitle').innerHTML = `<span>${esc(nm(p))}</span> wins!`;
      document.getElementById('winSub').textContent = `${nm('X')} ${scores.X} \u2013 ${scores.O} ${nm('O')}`;
      winModal.className = 'modal ' + p.toLowerCase();
      catEl.src = ''; catEl.src = catSrc;          // restart animation
      victoryEl.classList.add('show');
      document.getElementById('next').focus();
    }, 900);                                         // let the strike-through finish first
  }
  function hideVictory() { clearTimeout(victoryTimer); victoryEl.classList.remove('show'); }
  document.getElementById('next').addEventListener('click', () => { hideVictory(); newRound(); });
  document.getElementById('close').addEventListener('click', hideVictory);
  victoryEl.addEventListener('click', e => { if (e.target === victoryEl) hideVictory(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideVictory(); });

  newRound();
  openSetup();
</script>
</body>
</html>
